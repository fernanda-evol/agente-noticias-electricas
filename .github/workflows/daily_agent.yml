name: Agente Diario Mercado Electrico

on:
  schedule:
    # Se ejecuta todos los días a las 10:00 UTC (07:00 AM hora de Chile)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite ejecutar el agente manualmente desde GitHub cuando quieras

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite guardar los cambios de la base de datos en el repositorio

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Agente de Noticias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python agente_noticias_energia.py

      - name: Guardar cambios en la Base de Datos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias_energia.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update DB con noticias del dia [skip ci]" && git push)
