name: Reparar Resumenes ElectroMineria (uso unico)

on:
  workflow_dispatch: # Solo se corre a mano desde la pestaña Actions, no tiene schedule

jobs:
  reparar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reparar resúmenes cruzados
        run: python reparar_resumenes_electromineria.py

      - name: Guardar cambios en la Base de Datos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias_energia.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Reparar resumenes cruzados de ElectroMineria [skip ci]" && git push)
