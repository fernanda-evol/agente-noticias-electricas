name: Actualizar Analítica de Mercado (Capacidad y Contratos)

on:
  schedule:
    # Día 2 de cada mes, 12:00 UTC (09:00 Chile) — la API de capacidad
    # instalada se actualiza mensualmente desde el Coordinador, así que no
    # tiene sentido correr esto a diario. El día 2 (no el 1) da un margen
    # de un día por si el dato del mes se publica con un poco de atraso.
    - cron: '0 12 2 * *'
  workflow_dispatch: # Para correrlo a mano desde la pestaña Actions cuando quieras

jobs:
  actualizar-capacidad:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite guardar los cambios de mercado.duckdb en el repositorio

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        working-directory: analitica-mercado
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pipeline de capacidad instalada
        working-directory: analitica-mercado
        env:
          SIPUB_API_KEY: ${{ secrets.SIPUB_API_KEY }}
        run: python pipeline.py

      # El pipeline de contratos vía API (pipeline_contratos.py) quedó
      # DESACTIVADO desde 2026-09-29: la Plataforma de Contratos del
      # Coordinador (sin API, solo descarga manual) resultó tener
      # muchísima más cobertura (233 suministradoras y 2.950 clientes,
      # vs 23 y 52 por la API) y trae RUT directo. Los contratos ahora
      # se actualizan a mano con pipeline_contratos_manual.py cuando
      # Fernanda sube un Contratos_publica.xlsx nuevo -- no se pierde
      # nada por no correrlo aquí, porque no toca mercado.duckdb.

      - name: Guardar cambios en la base de datos
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add analitica-mercado/mercado.duckdb
          if [ -f analitica-mercado/pipeline_contratos_error.log ]; then
            git add -f analitica-mercado/pipeline_contratos_error.log
          fi
          if [ -f analitica-mercado/pipeline_contratos_debug.log ]; then
            git add -f analitica-mercado/pipeline_contratos_debug.log
          fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update capacidad instalada y contratos [skip ci]" && git push)
